x-app-environment: &app-environment
  APP_ENV: production
  PORT: "7860"
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
  CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:?CSRF_SECRET_KEY is required}
  COOKIE_SECURE: "true"
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  REALTIME_REDIS_REQUIRED: "true"
  ALLOW_IN_MEMORY_COORDINATION: "false"
  BACKGROUND_JOBS_INLINE: "false"
  BACKGROUND_JOB_WORKER_ENABLED: "true"
  PUBLIC_SIGNUP_ENABLED: "false"
  ONBOARDING_TOKEN: ${ONBOARDING_TOKEN:?ONBOARDING_TOKEN is required}
  METRICS_PUBLIC: "false"
  METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
  FILE_UPLOAD_DIR: /data/private/files
  CHAT_UPLOAD_DIR: /data/private/chat
  RECEIPT_UPLOAD_DIR: /data/private/receipts
  MALWARE_SCAN_REQUIRED: "true"
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  OHMATTOS_ENABLED: ${OHMATTOS_ENABLED:-false}
  OHMATTOS_JOBS_ENABLED: ${OHMATTOS_JOBS_ENABLED:-false}
  OHMATTOS_NOTIFICATIONS_ENABLED: ${OHMATTOS_NOTIFICATIONS_ENABLED:-false}
  OHMATTOS_ANALYTICS_ENABLED: ${OHMATTOS_ANALYTICS_ENABLED:-false}
  OHMATTOS_LOGS_ENABLED: ${OHMATTOS_LOGS_ENABLED:-false}
  OHMATTOS_STORAGE_ENABLED: ${OHMATTOS_STORAGE_ENABLED:-false}

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp:size=128m,noexec,nosuid,nodev
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  networks:
    - his-pro-network

services:
  db:
    image: postgres:16.14-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hispro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hispro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - his-pro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.10-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    networks:
      - his-pro-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - his-pro-network
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.migrate"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - private_uploads:/data/private
    <<: *app-security
    restart: "no"
    healthcheck:
      disable: true

  backend:
    build:
      context: .
      target: runtime
    environment: *app-environment
    ports:
      - "${BACKEND_PORT:-5000}:7860"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    volumes:
      - private_uploads:/data/private
    <<: *app-security

  background-worker:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.process_background_jobs"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - private_uploads:/data/private
    <<: *app-security
    healthcheck:
      disable: true

  integration-outbox-worker:
    profiles: ["ohmattos"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.process_integration_outbox"]
    environment: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    <<: *app-security
    healthcheck:
      disable: true

volumes:
  postgres_data:
  redis_data:
  clamav_data:
  private_uploads:

networks:
  his-pro-network:
    driver: bridge
